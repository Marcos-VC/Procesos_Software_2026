services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    volumes:
      # Los mocks JSON se escriben desde la API (perfil, menús): se montan para que persistan.
      - ./mocks:/mocks

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
